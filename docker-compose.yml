services:
  postgres:
    image: postgres:17-alpine
    container_name: hnb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hnb
      POSTGRES_PASSWORD: hnb_dev_password
      POSTGRES_DB: hnb_receivables
    ports:
      # Loopback only: the development database must not be reachable from the network.
      - "127.0.0.1:5433:5432"
    volumes:
      - hnb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hnb -d hnb_receivables"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hnb-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hnb_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hnb_postgres_data:
  hnb_redis_data:
